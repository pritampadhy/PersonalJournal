services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: change-me
    volumes: [journal-db:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  journal-db:
